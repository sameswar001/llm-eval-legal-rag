[project]
name = "llm-eval-legal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.1.4",
    "deepteam>=1.0.8",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
]
[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.40.0"]


[tool.pytest.ini_options]
markers = [
    "redteam: full DeepTeam adversarial sweep. Hundreds of LLM calls per run, so it is deselected by default and run from its own CI job rather than on every commit.",
]
# Deselect by default so `pytest tests/` and `deepeval test run tests/` stay
# cheap. Opt in with `-m redteam`. Note this makes the marker win even when
# the file is named directly — `pytest tests/red_team/test_context_injection_deepteam.py`
# collects nothing without `-m redteam`.
addopts = "-m 'not redteam'"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[project]
name = "llm-eval-legal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.1.4",
    "deepteam>=1.0.8",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
]
[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.40.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]
